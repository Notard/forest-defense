<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    하위 경로에서 내줄 때(GitHub Pages: /forest-defense/)는 `flutter build web --base-href /forest-defense/`가
    아래 자리표시를 바꾼다. 경로는 "/"로 시작하고 끝나야 한다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="숲속 친구들과 함께 둥지를 지키는 귀여운 레인 디펜스 게임">
  <meta name="theme-color" content="#1F3A1A">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="숲 지키기">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>숲 지키기</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #1F3A1A; }
    /* 첫 화면이 그려질 때까지 (그림·소리·엔진을 받는 몇 초) 보이는 안내 */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #FFF4DC; font: 600 22px/1.4 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      transition: opacity .4s;
    }
    #loading img { width: 112px; height: 112px; border-radius: 24px; animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt=""><div>숲으로 가는 중…</div></div>
  <script>
    // 첫 프레임이 그려지면 안내를 걷는다
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 450);
    });

    // "앱으로 설치" (지원하는 브라우저만). 게임의 메인 화면 버튼이 forestCanInstall / forestInstall을 부른다.
    window.__forestInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__forestInstall = e; });
    window.addEventListener('appinstalled', function () { window.__forestInstall = null; });
    window.forestCanInstall = function () { return !!window.__forestInstall; };
    window.forestInstall = async function () {
      var p = window.__forestInstall;
      if (!p) return false;
      window.__forestInstall = null;
      p.prompt();
      var choice = await p.userChoice;
      return choice.outcome === 'accepted';
    };

    // 오프라인 캐시 (tools/make_sw.py가 빌드 뒤 sw.js를 만든다). Flutter 기본 서비스 워커는 쓰지 않는다.
    if ('serviceWorker' in navigator) {
      // 새 버전이 올라오면 새 서비스 워커가 자리 잡는 순간 한 번 새로 고친다.
      // (안 그러면 첫 새로 고침에는 예전 저장본이 떠서 "고쳤는데 그대로"로 보인다. 처음 방문 때는 새로 고치지 않음)
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || window.__forestReloaded) return;
        window.__forestReloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
